<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Race to Turin{% endblock %}</title>
  <meta name="description" content="{{ summary_text }}">
  <link rel="canonical" href="{{ canonical }}">

  <!-- Shared-link preview (Reddit, Discord, Slack, Twitter). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="racetotur.in">
  <meta property="og:title" content="{% block og_title %}Race to Turin{% endblock %}">
  <meta property="og:description" content="{{ summary_text }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{% block tw_title %}Race to Turin{% endblock %}">
  <meta name="twitter:description" content="{{ summary_text }}">

  <!-- Inline so there is no extra asset to serve. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ffff55' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site">
    <p class="brand"><a href="/">racetotur.in</a></p>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site">
    <p>
      Standings from <a href="https://en.wikipedia.org/wiki/{{ season }}_ATP_Finals">Wikipedia — {{ season }} ATP Finals</a>,
      extracted and reformatted, available under
      <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
      · <a href="/methodology">Methodology &amp; data sources</a>
    </p>
  </footer>
</body>
</html>
