<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Race to Turin{% endblock %}</title>
  <meta name="description" content="{{ summary_text }}">
  <link rel="canonical" href="{{ canonical }}">

  <!-- Shared-link preview (Reddit, Discord, Slack, Twitter). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="racetotur.in">
  <meta property="og:title" content="{% block og_title %}Race to Turin{% endblock %}">
  <meta property="og:description" content="{{ summary_text }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{% block tw_title %}Race to Turin{% endblock %}">
  <meta name="twitter:description" content="{{ summary_text }}">

  <!-- Inline so there is no extra asset to serve. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23c8f031'/%3E%3Cpath d='M5.2 6.6c5.6 4.6 5.6 14.2 0 18.8M26.8 6.6c-5.6 4.6-5.6 14.2 0 18.8' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <!-- Runs before the stylesheet so a saved preference is applied on first paint. -->
  <script src="/static/theme.js?v={{ theme_version }}"></script>
  <link rel="stylesheet" href="/static/app.css?v={{ css_version }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site">
    <div class="site-bar">
      <a class="brand" href="/">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="15"/><path d="M5.2 6.6c5.6 4.6 5.6 14.2 0 18.8M26.8 6.6c-5.6 4.6-5.6 14.2 0 18.8"/></svg>
        <span>racetotur.in</span>
      </a>
      <nav class="site-nav" aria-label="Site">
        <a href="/methodology">Methodology</a>
        <div class="theme-picker" data-theme-picker role="group" aria-label="Color theme" hidden>
          <button type="button" data-theme-option="system" aria-pressed="true" title="System theme">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            <span class="sr-only">System</span>
          </button>
          <button type="button" data-theme-option="light" aria-pressed="false" title="Light theme">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
            <span class="sr-only">Light</span>
          </button>
          <button type="button" data-theme-option="dark" aria-pressed="false" title="Dark theme">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <span class="sr-only">Dark</span>
          </button>
        </div>
      </nav>
    </div>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site">
    <div class="site-foot">
      <p>
        Data adapted from <a href="https://en.wikipedia.org/wiki/{{ season }}_ATP_Finals">Wikipedia — {{ season }} ATP Finals</a>,
        <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>
      </p>
      <p><a href="/methodology">Methodology</a></p>
    </div>
  </footer>
</body>
</html>
